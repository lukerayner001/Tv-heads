<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TV Heads</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f3b; font-family: system-ui, -apple-system, sans-serif; color: #fff;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  .hidden { display: none !important; }
  #videos { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; left: 0; top: 0; }

  #lobby { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(15,18,40,.55); backdrop-filter: blur(3px); padding: 16px; }
  .card { width: min(380px, 100%); background: #262b55; border: 3px solid #5a4fcf; border-radius: 18px; padding: 22px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  h1 { margin: 0 0 4px; font-size: 34px; letter-spacing: 2px; text-align: center; }
  h1 span { display: inline-block; background: #111; border: 4px solid #8a5a3c; border-radius: 10px; padding: 0 10px; margin-right: 6px; }
  .sub { text-align: center; color: #b9c0ff; margin: 0 0 18px; font-size: 14px; }
  label { font-size: 13px; color: #b9c0ff; display: block; margin: 10px 0 4px; }
  input { width: 100%; font-size: 18px; padding: 12px; border-radius: 10px; border: 2px solid #444a88; background: #171a38; color: #fff; outline: none; }
  input:focus { border-color: #8ecae6; }
  #code { text-transform: uppercase; letter-spacing: 6px; text-align: center; font-weight: 700; }
  button { font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 12px; padding: 13px; font-size: 17px; color: #fff; }
  .big { width: 100%; margin-top: 12px; background: #e63946; }
  .join { background: #2a9d8f; }
  .or { text-align: center; color: #7f86c9; margin: 16px 0 0; font-size: 13px; }
  #status { min-height: 20px; margin-top: 14px; text-align: center; font-size: 14px; }
  .help { margin-top: 12px; font-size: 12px; color: #8a91d0; text-align: center; line-height: 1.5; }

  #hud { position: fixed; inset: 0; pointer-events: none; }
  #room { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; background: rgba(0,0,0,.5); border-radius: 12px; padding: 8px 12px; font-size: 14px; pointer-events: auto; display: flex; gap: 10px; align-items: center; }
  #roomcode { font-weight: 800; letter-spacing: 3px; font-size: 18px; color: #ffb703; }
  #copyBtn { padding: 6px 10px; font-size: 13px; background: #5a4fcf; border-radius: 8px; }
  #scores { position: absolute; top: max(10px, env(safe-area-inset-top)); right: 10px; background: rgba(0,0,0,.5); border-radius: 12px; padding: 8px 12px; font-size: 14px; min-width: 150px; }
  #scores div { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  #scores b { margin-left: auto; padding-left: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #selfwrap { position: absolute; left: 10px; bottom: max(10px, env(safe-area-inset-bottom)); width: 128px; aspect-ratio: 4/3; border: 6px solid #8a5a3c; border-radius: 12px; overflow: hidden; background: #000; }
  #selfwrap video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  #selfwrap.nocam::after { content: 'NO CAMERA'; position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
  #selfwrap.stunned { animation: shake .1s infinite; border-color: #fff176; }
  @keyframes shake { 0%{transform:translate(1px,0)} 50%{transform:translate(-2px,1px)} 100%{transform:translate(1px,-1px)} }
  .keys { position: absolute; bottom: max(10px, env(safe-area-inset-bottom)); right: 10px; font-size: 12px; color: #c6cbff; background: rgba(0,0,0,.4); padding: 6px 10px; border-radius: 8px; }
  #toast { position: fixed; top: 70px; left: 50%; transform: translate(-50%, -20px); background: #ffb703; color: #222; font-weight: 800; padding: 8px 16px; border-radius: 20px; opacity: 0; transition: .25s; pointer-events: none; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  #touch { position: fixed; inset: 0; pointer-events: none; }
  #touch .keys { display: none; }
  #stick { position: absolute; left: 24px; bottom: calc(max(24px, env(safe-area-inset-bottom)) + 110px); width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.3); pointer-events: auto; touch-action: none; }
  #knob { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.6); }
  .tbtn { position: absolute; width: 84px; height: 84px; border-radius: 50%; pointer-events: auto; touch-action: none; font-size: 15px; opacity: .85; }
  .tbtn.down { transform: scale(.92); opacity: 1; }
  #zapBtn { right: 24px; bottom: calc(max(24px, env(safe-area-inset-bottom)) + 40px); background: #e9c46a; color: #222; width: 96px; height: 96px; }
  #jumpBtn { right: 130px; bottom: calc(max(24px, env(safe-area-inset-bottom)) + 10px); background: #457b9d; }
  @media (pointer: coarse) { .keys { display: none; } #selfwrap { width: 96px; } }
</style>
</head>
<body>
<div id="videos"></div>

<div id="lobby">
  <div class="card">
    <h1><span>📺</span>TV HEADS</h1>
    <p class="sub">Your webcam is your face.</p>
    <label for="name">Your name</label>
    <input id="name" maxlength="14" placeholder="e.g. Luke" autocomplete="off">
    <button class="big" id="hostBtn">Host a new game</button>
    <p class="or">— or join a friend —</p>
    <label for="code">Room code</label>
    <input id="code" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters">
    <button class="big join" id="joinBtn">Join game</button>
    <div id="status"></div>
    <div class="help">Allow camera access when asked. Video goes straight between players — nothing is recorded.</div>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="room">Room <span id="roomcode"></span><button id="copyBtn">Copy invite</button></div>
  <div id="scores"></div>
  <div id="selfwrap"><video id="selfview" muted playsinline autoplay></video></div>
  <div class="keys">W/S move · A/D turn · Space jump · F zap · gamepad works too</div>
</div>

<div id="touch" class="hidden">
  <div id="stick"><div id="knob"></div></div>
  <button class="tbtn" id="jumpBtn">JUMP</button>
  <button class="tbtn" id="zapBtn">ZAP</button>
</div>

<div id="toast"></div>
